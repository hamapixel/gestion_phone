name: PhoneStock Pro checks

on:
  push:
    branches: [main, feature/phase-01-socle, feature/phase-02-owner-auth-sticky-header]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: phonestock
          POSTGRES_USER: phonestock
          POSTGRES_PASSWORD: phonestock_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phonestock -d phonestock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-test-key-not-for-production"
      POSTGRES_DB: phonestock
      POSTGRES_USER: phonestock
      POSTGRES_PASSWORD: phonestock_ci_only
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test core
      - run: python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
